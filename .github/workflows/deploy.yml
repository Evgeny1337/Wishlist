name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "ERROR: secret DEPLOY_SSH_KEY пустой"
            exit 1
          fi

          # Нормализуем переносы строк (часто ломается при вставке в GitHub UI)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Проверка, что это private key
          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "ERROR: DEPLOY_SSH_KEY не похож на private key (нет BEGIN PRIVATE KEY)"
            echo "В secret должен быть содержимое файла БЕЗ .pub"
            exit 1
          fi

          echo "Key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key || true
          echo "Public key derived from secret:"
          ssh-keygen -y -f ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          echo "==> git pull"
          git pull

          echo "==> check frontend static"
          if [ ! -f frontend/index.html ]; then
            echo "ERROR: нет статики клиента в $(pwd)/frontend/"
            echo "Ожидается frontend/index.html (результат npm run build:prod из WishlistClient)."
            echo "Залей build/ на сервер и перезапусти deploy."
            ls -la frontend/ || true
            exit 1
          fi
          echo "frontend ok: frontend/index.html"

          echo "==> docker compose up"
          docker compose up -d --build

          echo "==> health checks"
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null \
              && curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ | grep -qE '200|304'; then
              echo
              echo "health ok (web :8080 + /api/health)"
              ok=1
              break
            fi
            echo "waiting for web/api... ($i)"
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "health check failed"
            docker compose ps
            docker compose logs --tail=80 api web
            exit 1
          fi
          REMOTE
