<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
      <h1 id="title">JS not run yet</h1>
      <pre id="log"></pre>
    <a id="test" style="display: none">Hello</a>
    <script>
        var logEl = document.getElementById("log");
        function log(msg) {
            logEl.textContent += msg + "\n";
        }
        document.getElementById("title").textContent = "JS is running";
        log("origin: " + location.origin);
        let webApp = window.Telegram.WebApp
        webApp.ready()
        log("initData length: " + (webApp.initData ? webApp.initData.length : 0));
        if (!webApp.initData) {
            log("No initData — not opened as Mini App?");
        }

        if(webApp.initData){
            fetch(`${location.origin}/api/telegram_webapp/activate-invite`,{
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    init_data: webApp.initData,
                    token: "test"
                })
            })
                .then(response => {
                    if(response.ok) {
                        let test = document.getElementById("test")
                        test.style.display = 'inline'
                    }
                })
                .catch(error => {
                    console.log("Что-то не так")
                })
        }
    </script>
</body>
</html>
