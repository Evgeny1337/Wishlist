# Пример для хостового nginx + certbot (как у trusttunnel).
# Подставь свой домен и путь к сертификатам после:
#   sudo certbot --nginx -d wishlist.example.com
#
# Прокси на compose-сервис web (см. docker-compose.yml: 127.0.0.1:8080).

server {
    listen 80;
    server_name wishlist.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wishlist.example.com;

    ssl_certificate     /etc/letsencrypt/live/wishlist.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wishlist.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
